<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flores para ti</title>
    <meta name="description" content="Un jardín de flores amarillas, para alguien especial." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="preconnect" href="https://rr1---sn-.googlevideo.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://www.youtube.com/iframe_api" async></script>
  </head>
  <body>
    <div class="night">
      <div class="sky" aria-hidden="true"></div>
      <div class="floaters" id="floaters" aria-hidden="true"></div>

      <div class="yt-stage" aria-hidden="true">
        <div id="ytPlayer"></div>
      </div>

      <svg class="sprite" aria-hidden="true">
        <defs>
          <radialGradient id="coreSun" cx="38%" cy="34%" r="72%">
            <stop offset="0%" stop-color="#7d4d26" />
            <stop offset="55%" stop-color="#432714" />
            <stop offset="100%" stop-color="#22120a" />
          </radialGradient>
          <radialGradient id="coreSoft" cx="40%" cy="36%" r="70%">
            <stop offset="0%" stop-color="#fff6c4" />
            <stop offset="100%" stop-color="#eda800" />
          </radialGradient>
        </defs>
        <symbol id="icon-sun" viewBox="0 0 64 64">
          <g>
            <ellipse cx="32" cy="9" rx="6" ry="16.5" />
            <ellipse cx="32" cy="9" rx="6" ry="16.5" transform="rotate(30 32 32)" />
            <ellipse cx="32" cy="9" rx="6" ry="16.5" transform="rotate(60 32 32)" />
            <ellipse cx="32" cy="9" rx="6" ry="16.5" transform="rotate(90 32 32)" />
            <ellipse cx="32" cy="9" rx="6" ry="16.5" transform="rotate(120 32 32)" />
            <ellipse cx="32" cy="9" rx="6" ry="16.5" transform="rotate(150 32 32)" />
            <ellipse cx="32" cy="9" rx="6" ry="16.5" transform="rotate(180 32 32)" />
            <ellipse cx="32" cy="9" rx="6" ry="16.5" transform="rotate(210 32 32)" />
            <ellipse cx="32" cy="9" rx="6" ry="16.5" transform="rotate(240 32 32)" />
            <ellipse cx="32" cy="9" rx="6" ry="16.5" transform="rotate(270 32 32)" />
            <ellipse cx="32" cy="9" rx="6" ry="16.5" transform="rotate(300 32 32)" />
            <ellipse cx="32" cy="9" rx="6" ry="16.5" transform="rotate(330 32 32)" />
          </g>
          <circle cx="32" cy="32" r="11.4" fill="url(#coreSun)" />
          <circle cx="32" cy="32" r="11.4" fill="none" stroke="#d9a51d" stroke-width="1.2" opacity=".5" />
        </symbol>
        <symbol id="icon-blossom" viewBox="0 0 64 64">
          <g>
            <ellipse cx="32" cy="14" rx="10" ry="18" />
            <ellipse cx="32" cy="14" rx="10" ry="18" transform="rotate(72 32 32)" />
            <ellipse cx="32" cy="14" rx="10" ry="18" transform="rotate(144 32 32)" />
            <ellipse cx="32" cy="14" rx="10" ry="18" transform="rotate(216 32 32)" />
            <ellipse cx="32" cy="14" rx="10" ry="18" transform="rotate(288 32 32)" />
          </g>
          <circle cx="32" cy="32" r="8.5" fill="url(#coreSoft)" />
        </symbol>
      </svg>

      <main class="card">
        <section class="cover" id="cover">
          <button class="cover-btn" id="startBtn" type="button">
            <span class="cover-flower" aria-hidden="true">
              <svg viewBox="0 0 120 120">
                <defs>
                  <radialGradient id="petalGold" cx="50%" cy="40%" r="70%">
                    <stop offset="0%" stop-color="#ffe566" />
                    <stop offset="55%" stop-color="#f5c518" />
                    <stop offset="100%" stop-color="#d4920a" />
                  </radialGradient>
                  <radialGradient id="seedDark" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#6b4226" />
                    <stop offset="70%" stop-color="#3a2414" />
                    <stop offset="100%" stop-color="#24150c" />
                  </radialGradient>
                </defs>
                <g class="cover-petals">
                  <g fill="url(#petalGold)">
                    <ellipse cx="60" cy="22" rx="9" ry="20" />
                    <ellipse cx="60" cy="22" rx="9" ry="20" transform="rotate(22.5 60 60)" />
                    <ellipse cx="60" cy="22" rx="9" ry="20" transform="rotate(45 60 60)" />
                    <ellipse cx="60" cy="22" rx="9" ry="20" transform="rotate(67.5 60 60)" />
                    <ellipse cx="60" cy="22" rx="9" ry="20" transform="rotate(90 60 60)" />
                    <ellipse cx="60" cy="22" rx="9" ry="20" transform="rotate(112.5 60 60)" />
                    <ellipse cx="60" cy="22" rx="9" ry="20" transform="rotate(135 60 60)" />
                    <ellipse cx="60" cy="22" rx="9" ry="20" transform="rotate(157.5 60 60)" />
                    <ellipse cx="60" cy="22" rx="9" ry="20" transform="rotate(180 60 60)" />
                    <ellipse cx="60" cy="22" rx="9" ry="20" transform="rotate(202.5 60 60)" />
                    <ellipse cx="60" cy="22" rx="9" ry="20" transform="rotate(225 60 60)" />
                    <ellipse cx="60" cy="22" rx="9" ry="20" transform="rotate(247.5 60 60)" />
                    <ellipse cx="60" cy="22" rx="9" ry="20" transform="rotate(270 60 60)" />
                    <ellipse cx="60" cy="22" rx="9" ry="20" transform="rotate(292.5 60 60)" />
                    <ellipse cx="60" cy="22" rx="9" ry="20" transform="rotate(315 60 60)" />
                    <ellipse cx="60" cy="22" rx="9" ry="20" transform="rotate(337.5 60 60)" />
                  </g>
                </g>
                <circle cx="60" cy="60" r="22" fill="url(#seedDark)" />
                <circle cx="60" cy="60" r="18" fill="none" stroke="#c9a227" stroke-width="1.4" opacity="0.45" />
                <g fill="#2a1810" opacity="0.55">
                  <circle cx="54" cy="54" r="1.2" />
                  <circle cx="66" cy="52" r="1.1" />
                  <circle cx="58" cy="62" r="1.3" />
                  <circle cx="70" cy="63" r="1" />
                  <circle cx="50" cy="64" r="1.1" />
                  <circle cx="62" cy="70" r="1.2" />
                  <circle cx="53" cy="71" r="0.9" />
                  <circle cx="68" cy="56" r="1" />
                  <circle cx="47" cy="58" r="0.9" />
                  <circle cx="61" cy="48" r="1" />
                </g>
              </svg>
            </span>
            <span class="cover-label">Flores para ti</span>
          </button>
          <p class="cover-hint">Toca el girasol</p>
        </section>

        <section class="garden" id="garden" hidden>
          <div class="heart-glow" id="heartGlow" aria-hidden="true"></div>
          <div class="flowers" id="flowers" aria-hidden="true"></div>

          <svg class="tree-svg" viewBox="0 0 1000 800" aria-hidden="true">
            <defs>
              <linearGradient id="bark" x1="0" y1="1" x2="0.25" y2="0">
                <stop offset="0%" stop-color="#4f2810" />
                <stop offset="55%" stop-color="#6b3a1a" />
                <stop offset="100%" stop-color="#8a5228" />
              </linearGradient>
              <radialGradient id="soil" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#4a2a12" stop-opacity="0.42" />
                <stop offset="55%" stop-color="#4a2a12" stop-opacity="0.16" />
                <stop offset="100%" stop-color="#4a2a12" stop-opacity="0" />
              </radialGradient>
            </defs>

            <ellipse class="ground" cx="500" cy="598" rx="205" ry="17" fill="url(#soil)" />

            <g
              fill="none"
              stroke="url(#bark)"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="tree-strokes"
            >
              <path class="grow" data-order="0" stroke-width="27" d="M500 594 C 505 552, 495 490, 500 416" />
              <path class="grow" data-order="1" stroke-width="13" d="M500 432 C 468 400, 432 356, 390 300" />
              <path class="grow" data-order="1" stroke-width="13" d="M500 430 C 532 398, 568 354, 610 300" />
              <path class="grow" data-order="2" stroke-width="11" d="M500 416 C 496 356, 504 292, 500 208" />
              <path class="grow" data-order="2" stroke-width="10" d="M460 372 C 420 330, 380 288, 330 240" />
              <path class="grow" data-order="2" stroke-width="10" d="M540 370 C 580 328, 620 286, 670 238" />
              <path class="grow" data-order="3" stroke-width="8" d="M440 350 C 420 300, 408 252, 404 200" />
              <path class="grow" data-order="3" stroke-width="8" d="M560 348 C 580 298, 592 250, 596 198" />
              <path class="grow" data-order="3" stroke-width="8" d="M390 300 C 356 262, 320 224, 288 184" />
              <path class="grow" data-order="3" stroke-width="8" d="M610 298 C 644 260, 680 222, 712 182" />
              <path class="grow" data-order="4" stroke-width="6" d="M330 240 C 306 212, 288 190, 274 164" />
              <path class="grow" data-order="4" stroke-width="6" d="M670 238 C 694 210, 712 188, 726 162" />
              <path class="grow" data-order="4" stroke-width="6" d="M500 300 C 478 266, 462 236, 452 200" />
              <path class="grow" data-order="4" stroke-width="6" d="M500 296 C 522 262, 538 232, 548 196" />
            </g>
          </svg>

          <div class="petal-rain" id="petalRain" aria-hidden="true"></div>

          <article class="letter" id="letter">
            <p class="letter-date">21 de septiembre</p>
            <p class="letter-to" id="letterTo">Para ti</p>
            <p class="letter-body" id="letterBody"></p>
            <p class="letter-sign" id="letterSign"></p>
          </article>

          <button class="mute-btn" id="muteBtn" type="button" hidden aria-label="Silenciar canción">♪</button>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
